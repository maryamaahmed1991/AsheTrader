name: Build Ashe's Trader
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download Dalamud development libraries
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -LiteralPath dalamud.zip -DestinationPath "$env:APPDATA/XIVLauncher/addon/Hooks/dev" -Force
      - name: Test and package
        shell: pwsh
        run: ./scripts/Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AsheTrader
          path: |
            artifacts/AsheTrader-*.zip
            artifacts/AsheTrader.json
          if-no-files-found: error
